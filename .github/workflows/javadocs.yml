name: Generate and Publish Javadocs

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:

  javadocs:

    name: Generate Javadocs
  
    runs-on: ubuntu-latest
  
    permissions:
      contents: write

    steps:

      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK 26
        id: setup-jdk26
        uses: actions/setup-java@v5
        with:
          java-version: 26
          distribution: 'temurin'

      - name: Save JDK 26 home
        run: echo "JDK26_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Set version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=v0.0.0-test" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Generate Javadocs
        run: |
          mvn -B verify -DskipTests -Dgpg.skip=true -P build-site-docs \
            -DjavadocJdk26.executable="${JDK26_HOME}/bin/javadoc"

      - name: Move docs to versioned directory
        run: |
          rm -rf docs/${VERSION}
          mkdir -p docs/${VERSION}
          mv mysingingmonsters-client/target/javadocs-jdk26/apidocs docs/${VERSION}

      - name: Commit and push javadocs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Generate javadocs for ${VERSION}"
          git push origin master